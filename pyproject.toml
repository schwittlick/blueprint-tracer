[project]
name = "blueprint-tracer"
version = "0.1.0"
description = "Convert scanned mechanical blueprints into centerline vectors for pen plotting."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scikit-image>=0.22",
    "scipy>=1.10",
    "pillow>=10.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[project.scripts]
blueprint-tracer = "blueprint_tracer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blueprint_tracer*"]
